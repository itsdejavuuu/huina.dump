name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: huina_dump
          path: build/Release/huina_dump.dll
